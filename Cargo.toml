[workspace]
members = ["crates/app", "crates/platform", "crates/platform-core", "crates/platform-windows"]
resolver = "2"

[workspace.package]
version = "0.5.4"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# A worker-thread panic must become an error (JoinHandle::join) instead of
# terminating a tray app that is expected to run for months. The window proc
# also catches unwinds at its own FFI boundary.
# panic = "abort"
strip = true
