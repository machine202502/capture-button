[package]
name = "platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
platform-core = { path = "../platform-core" }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# The live portal check in `examples/portal_grab.rs` is a manual tool for a
# Linux session. It is not a test and it cannot build where the crate is empty,
# so it is opt-in: `cargo run -p platform-linux --features portal-example
# --example portal_grab -- /tmp/portal.png`.
portal-example = []

[[example]]
name = "portal_grab"
required-features = ["portal-example"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "composite", "randr", "shape"] }
libc = "0.2"
cpal = "0.18"
ksni = { version = "0.3", features = ["blocking"] }
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "screencast", "tokio"] }
futures-util = "0.3"
pipewire = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net"] }
# Baked annotations: paths and anti-aliasing from tiny-skia, glyph outlines from
# ab_glyph. Both are already in the graph (Slint's SVG support and winit's
# client-side decorations pull them in).
tiny-skia = "0.12"
ab_glyph = "0.2"
