[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
publish = false

[[bin]]
name = "CaptureButton"
path = "src/main.rs"

[dependencies]
serde_json = "1"
png = "0.17"
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "filter", "software-scaling", "software-resampling"] }
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
platform = { path = "../platform" }

[build-dependencies]
slint-build = "=1.19.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
